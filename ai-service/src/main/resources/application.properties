spring.application.name=ai-service
server.port=8083
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],configserver:${CONFIG_SERVER_URL:http://localhost:8888}

spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-flash-lite-latest}
spring.ai.google.genai.chat.options.temperature=0
spring.ai.google.genai.chat.options.include-thoughts=true
spring.ai.model.chat=${AI_CHAT_MODEL:none}
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

spring.ai.mcp.client.name=bank-assistant
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.initialized=true
spring.ai.mcp.client.request-timeout=15s
spring.ai.mcp.client.toolcallback.enabled=true
spring.ai.mcp.client.streamable-http.connections.accounts.url=${ACCOUNT_MCP_URL:http://localhost:8081}
spring.ai.mcp.client.streamable-http.connections.accounts.endpoint=/mcp
spring.ai.mcp.client.streamable-http.connections.transactions.url=${TRANSACTION_MCP_URL:http://localhost:8082}
spring.ai.mcp.client.streamable-http.connections.transactions.endpoint=/mcp
management.endpoints.web.exposure.include=health,info
