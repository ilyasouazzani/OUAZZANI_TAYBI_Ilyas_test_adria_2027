spring.application.name=gateway-service
server.port=8080
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}
bank.routes.accounts=${ACCOUNT_SERVICE_URI:lb://account-service}
bank.routes.transactions=${TRANSACTION_SERVICE_URI:lb://transaction-service}
bank.routes.assistant=${AI_SERVICE_URI:lb://ai-service}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
