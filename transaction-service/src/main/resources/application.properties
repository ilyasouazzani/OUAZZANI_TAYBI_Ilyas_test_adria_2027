spring.application.name=transaction-service
server.port=8082
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],configserver:${CONFIG_SERVER_URL:http://localhost:8888}

spring.datasource.url=jdbc:h2:mem:transactiondb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

bank.account-service.url=${ACCOUNT_SERVICE_URL:}
spring.cloud.openfeign.client.config.account-service.connect-timeout=1000
spring.cloud.openfeign.client.config.account-service.read-timeout=2000
spring.cloud.loadbalancer.retry.enabled=false

resilience4j.circuitbreaker.instances.accountService.sliding-window-size=6
resilience4j.circuitbreaker.instances.accountService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.accountService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accountService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.accountService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.accountService.ignore-exceptions=feign.FeignException$FeignClientException
resilience4j.retry.instances.accountService.max-attempts=3
resilience4j.retry.instances.accountService.wait-duration=200ms
resilience4j.retry.instances.accountService.retry-exceptions=feign.RetryableException,feign.FeignException$FeignServerException
resilience4j.retry.instances.accountService.ignore-exceptions=feign.FeignException$FeignClientException
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents,retries,retryevents
