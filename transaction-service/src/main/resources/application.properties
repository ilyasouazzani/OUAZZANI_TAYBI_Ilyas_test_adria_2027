spring.application.name=transaction-service
server.port=8082
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:h2:mem:transactiondb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

bank.transaction.max-amount=1000
bank.account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
spring.cloud.openfeign.client.config.account-service.connect-timeout=2000
spring.cloud.openfeign.client.config.account-service.read-timeout=3000
