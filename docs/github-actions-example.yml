name: Build and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile and test
        run: mvn -B verify
      - name: Registry login
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and publish images
        shell: bash
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          export IMAGE_TAG="$GITHUB_SHA"
          docker compose build
          docker compose push discovery-service config-service account-service transaction-service ai-service gateway-service
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    environment: demo
    runs-on: [self-hosted, bank-demo]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to preconfigured demo host
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          export IMAGE_TAG="$GITHUB_SHA"
          export AI_CHAT_MODEL=google-genai
          docker compose pull
          docker compose up -d --no-build
